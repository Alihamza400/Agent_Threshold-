[project]
name = "agentthreshold"
version = "0.1.0"
description = "Real-Time Transaction Firewall for Autonomous AI Agents"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
    "shared",
    "services/*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["contracts/lib"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"