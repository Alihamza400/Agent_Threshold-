# Per-service overrides for mcp-server
replicaCount: 1

appModule: "mcp_server.main:app"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 75

env:
  LOG_LEVEL: "INFO"
