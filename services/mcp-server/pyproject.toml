[project]
name = "at-mcp-server"
version = "0.1.0"
description = "AgentThreshold MCP server: read-only tools via official MCP SDK, allow-listed + signed"
requires-python = ">=3.12"
dependencies = [
    "at-shared>=0.1.0",
    "mcp>=1.2.0",
    "uvicorn[standard]>=0.30.0",
    "redis>=5.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
]

[tool.uv]
package = true

[tool.uv.sources]
at-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]