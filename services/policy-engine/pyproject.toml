[project]
name = "at-policy-engine"
version = "0.1.0"
description = "AgentThreshold Policy Engine: deterministic policy evaluation (fail-closed)"
requires-python = ">=3.12"
dependencies = [
    "at-shared>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = true

[tool.uv.sources]
at-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]