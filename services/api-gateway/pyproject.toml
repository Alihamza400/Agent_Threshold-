[project]
name = "at-api-gateway"
version = "0.1.0"
description = "AgentThreshold API Gateway: authN/authZ, rate limiting, routing"
requires-python = ">=3.12"
dependencies = [
    "at-shared>=0.1.0",
    "at-policy-engine>=0.1.0",
    "at-anomaly-scorer>=0.1.0",
    "at-screening-agents>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.2.0",
    "redis>=5.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = true

[tool.uv.sources]
at-shared = { workspace = true }
at-policy-engine = { workspace = true }
at-anomaly-scorer = { workspace = true }
at-screening-agents = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]