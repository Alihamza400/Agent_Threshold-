[project]
name = "at-blockchain"
version = "0.1.0"
description = "AgentThreshold blockchain integration: RPC cross-check, fork simulation, nonce, oracle"
requires-python = ">=3.12"
dependencies = [
    "at-shared>=0.1.0",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.uv]
package = true

[tool.uv.sources]
at-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]