[project]
name = "at-notification"
version = "0.1.0"
description = "AgentThreshold escalation notification service: Slack/webhook delivery with retry/backoff + fail-closed expiry"
requires-python = ">=3.12"
dependencies = [
    "at-shared>=0.1.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.uv]
package = true

[tool.uv.sources]
at-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"