[project]
name = "at-orchestrator"
version = "0.1.0"
description = "AgentThreshold orchestrator: fail-closed screening pipeline with per-stage budgets"
requires-python = ">=3.12"
dependencies = [
    "at-shared>=0.1.0",
    "at-policy-engine>=0.1.0",
    "at-anomaly-scorer>=0.1.0",
    "at-screening-agents>=0.1.0",
    "at-blockchain>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.uv]
package = true

[tool.uv.sources]
at-shared = { workspace = true }
at-policy-engine = { workspace = true }
at-anomaly-scorer = { workspace = true }
at-screening-agents = { workspace = true }
at-blockchain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
