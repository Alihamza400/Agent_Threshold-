[project]
name = "at-audit-service"
version = "0.1.0"
description = "AgentThreshold audit anchoring: async Merkle batching + on-chain AuditAnchor submission"
requires-python = ">=3.12"
dependencies = [
    "at-shared>=0.1.0",
    "at-blockchain>=0.1.0",
    "eth-account>=0.11.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[tool.uv]
package = true

[tool.uv.sources]
at-shared = { workspace = true }
at-blockchain = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]