[project]
name = "at-shared"
version = "0.1.0"
description = "Shared canonical models, schemas, and infrastructure for AgentThreshold"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "alembic>=1.13.0",
    "pyjwt>=2.9.0",
    "redis>=5.0.0",
    "eth-hash[pycryptodome]>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/at_shared"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]