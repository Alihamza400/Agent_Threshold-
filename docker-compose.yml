# =====================================================================
# AgentThreshold — Local Development Infrastructure
# Postgres (HA-ready config) + Redis (locks/rate-limit/cache)
# Optional: API gateway + orchestrator for full-stack local testing
# =====================================================================

name: agentthreshold

services:
  postgres:
    image: postgres:16-alpine
    container_name: at-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentthreshold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentthreshold_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agentthreshold}
    ports:
      - "5433:5432"
    volumes:
      - .postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentthreshold"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"

  redis:
    image: redis:7-alpine
    container_name: at-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - .redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        SERVICE: api-gateway
    container_name: at-api-gateway
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-agentthreshold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentthreshold_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agentthreshold}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-not-for-production}
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/healthz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
      args:
        SERVICE: orchestrator
    container_name: at-orchestrator
    ports:
      - "8001:8001"
    environment:
      APP_ENV: development
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-agentthreshold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentthreshold_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agentthreshold}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/healthz').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
