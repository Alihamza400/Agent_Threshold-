# =====================================================================
# AgentThreshold — Local Development Infrastructure (Phase 1)
# Postgres (HA-ready config) + Redis (locks/rate-limit/cache)
# =====================================================================

name: agentthreshold

services:
  postgres:
    image: postgres:16-alpine
    container_name: at-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentthreshold}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentthreshold_dev}
      POSTGRES_DB: ${POSTGRES_DB:-agentthreshold}
    ports:
      - "5433:5432"
    volumes:
      - .postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentthreshold"]
      interval: 5s
      timeout: 5s
      retries: 10
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"          # enables PITR / logical replication (RPO target)

  redis:
    image: redis:7-alpine
    container_name: at-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"
    volumes:
      - .redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10